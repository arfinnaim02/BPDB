name: BPDB daily collection

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bpdb-collection-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONPATH: backend
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip check

      - name: Prepare private Drive credentials
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON }}
          DRIVE_CONFIG_JSON: ${{ secrets.GOOGLE_DRIVE_CONFIG_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          try:
              token = json.loads(os.environ["DRIVE_TOKEN_JSON"])
              config = json.loads(os.environ["DRIVE_CONFIG_JSON"])

              for field in ("refresh_token", "client_id", "client_secret"):
                  if not token.get(field):
                      raise ValueError("Incomplete token")

              if not config.get("folder_id"):
                  raise ValueError("Missing folder ID")
          except Exception:
              raise SystemExit(
                  "Missing or invalid Drive secrets. "
                  "Check the two repository JSON secrets."
              ) from None

          for field in ("refresh_token", "client_secret", "token"):
              if token.get(field):
                  print("::add-mask::" + token[field])

          folder = Path("secrets")
          folder.mkdir(mode=0o700, exist_ok=True)

          for name, value in (
              ("google_drive_token.json", token),
              ("google_drive_config.json", config),
          ):
              target = folder / name
              target.write_text(json.dumps(value), encoding="utf-8")
              target.chmod(0o600)

          print("Drive credentials prepared.")
          PY

      - name: Restore verified collection state
        id: restore
        run: python -u -m ingestion.drive_sync pull

      - name: Collect and process recent reports
        id: worker
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -u -m ingestion.daily_worker --apply --trigger manual

      - name: Save verified collection state
        id: save
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && steps.worker.outcome != 'skipped' }}
        continue-on-error: true
        run: python -u -m ingestion.drive_sync push

      - name: Report pipeline result
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        env:
          WORKER_RESULT: ${{ steps.worker.outcome }}
          STORAGE_RESULT: ${{ steps.save.outcome }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          worker = os.environ["WORKER_RESULT"]
          storage = os.environ["STORAGE_RESULT"]

          summary = (
              "## BPDB collection\n\n"
              f"- Worker: **{worker}**\n"
              f"- Drive checkpoint: **{storage}**\n"
          )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as handle:
              handle.write(summary)

          if worker != "success" or storage != "success":
              raise SystemExit(
                  "Pipeline needs attention. Inspect worker and storage logs."
              )

          print("Collection and Drive checkpoint succeeded.")
          PY

      - name: Remove temporary credentials
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in (
              "google_drive_token.json",
              "google_drive_config.json",
          ):
              (Path("secrets") / name).unlink(missing_ok=True)
          PY