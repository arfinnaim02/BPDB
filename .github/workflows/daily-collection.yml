name: BPDB daily collection

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: bpdb-collection-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    env:
      PYTHONPATH: backend
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip check

      - name: Check BPDB connectivity
        run: |
          python - <<'PY'
          import json
          import socket
          import ssl

          import certifi
          import httpx

          from ingestion.http import create_client

          host = "misc.bpdb.gov.bd"
          url = f"https://{host}/daily-generation-archive?page=1"

          try:
              addresses = socket.getaddrinfo(
                  host, 443, type=socket.SOCK_STREAM
              )
              print(json.dumps({
                  "dns": "passed",
                  "addresses": sorted({
                      item[4][0] for item in addresses
                  }),
              }), flush=True)
          except OSError as exc:
              print(json.dumps({
                  "dns": "failed",
                  "error_type": type(exc).__name__,
                  "errno": exc.errno,
              }), flush=True)
              raise SystemExit(1) from None

          def probe(label, factory):
              try:
                  with factory() as client:
                      with client.stream("GET", url) as response:
                          content_type = response.headers.get(
                              "content-type", ""
                          )
                          passed = (
                              response.status_code == 200
                              and "html" in content_type.lower()
                          )
                          print(json.dumps({
                              "client": label,
                              "passed": passed,
                              "http_status": response.status_code,
                              "content_type": content_type,
                          }), flush=True)
                          return passed
              except Exception as exc:
                  chain = []
                  current = exc
                  seen = set()

                  while current is not None and id(current) not in seen:
                      seen.add(id(current))
                      item = {
                          "error_type": type(current).__name__,
                      }
                      if isinstance(current, OSError):
                          item["errno"] = current.errno
                      if isinstance(
                          current, ssl.SSLCertVerificationError
                      ):
                          item["verify_code"] = current.verify_code
                          item["verify_message"] = current.verify_message

                      chain.append(item)
                      current = (
                          current.__cause__ or current.__context__
                      )

                  print(json.dumps({
                      "client": label,
                      "passed": False,
                      "exception_chain": chain,
                  }), flush=True)
                  return False

          current_ok = probe(
              "current_operating_system_store",
              lambda: create_client(timeout=20),
          )

          probe(
              "verified_ca_bundle",
              lambda: httpx.Client(
                  verify=ssl.create_default_context(
                      cafile=certifi.where()
                  ),
                  timeout=20,
                  follow_redirects=False,
                  headers={
                      "User-Agent": "BPDB-Research-Collector/0.2"
                  },
              ),
          )

          if not current_ok:
              raise SystemExit(
                  "BPDB connectivity preflight failed. "
                  "Review the diagnostic output."
              )
          PY

      - name: Prepare private Drive credentials
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON }}
          DRIVE_CONFIG_JSON: ${{ secrets.GOOGLE_DRIVE_CONFIG_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          try:
              token = json.loads(os.environ["DRIVE_TOKEN_JSON"])
              config = json.loads(os.environ["DRIVE_CONFIG_JSON"])

              for field in ("refresh_token", "client_id", "client_secret"):
                  if not token.get(field):
                      raise ValueError("Incomplete token")

              if not config.get("folder_id"):
                  raise ValueError("Missing folder ID")
          except Exception:
              raise SystemExit(
                  "Missing or invalid Drive secrets. "
                  "Check the two repository JSON secrets."
              ) from None

          for field in ("refresh_token", "client_secret", "token"):
              if token.get(field):
                  print("::add-mask::" + token[field])

          folder = Path("secrets")
          folder.mkdir(mode=0o700, exist_ok=True)

          for name, value in (
              ("google_drive_token.json", token),
              ("google_drive_config.json", config),
          ):
              target = folder / name
              target.write_text(json.dumps(value), encoding="utf-8")
              target.chmod(0o600)

          print("Drive credentials prepared.")
          PY

      - name: Restore verified collection state
        id: restore
        run: python -u -m ingestion.drive_sync pull

      - name: Collect and process recent reports
        id: worker
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -u -m ingestion.daily_worker --apply --trigger "${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}"

      - name: Save verified collection state
        id: save
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && steps.worker.outcome != 'skipped' }}
        continue-on-error: true
        run: python -u -m ingestion.drive_sync push

      - name: Report pipeline result
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        env:
          WORKER_RESULT: ${{ steps.worker.outcome }}
          STORAGE_RESULT: ${{ steps.save.outcome }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          worker = os.environ["WORKER_RESULT"]
          storage = os.environ["STORAGE_RESULT"]

          summary = (
              "## BPDB collection\n\n"
              f"- Worker: **{worker}**\n"
              f"- Drive checkpoint: **{storage}**\n"
          )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as handle:
              handle.write(summary)

          if worker != "success" or storage != "success":
              raise SystemExit(
                  "Pipeline needs attention. Inspect worker and storage logs."
              )

          print("Collection and Drive checkpoint succeeded.")
          PY

      - name: Remove temporary credentials
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in (
              "google_drive_token.json",
              "google_drive_config.json",
          ):
              (Path("secrets") / name).unlink(missing_ok=True)
          PY