name: BPDB online gap investigation

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: First date in the gap window (YYYY-MM-DD)
        required: true
        default: "2024-01-01"
      end_date:
        description: Last date in the gap window (YYYY-MM-DD)
        required: true
        default: "2024-12-31"
      max_files:
        description: Maximum candidate PDFs in this bounded investigation
        type: choice
        options: ["5", "10", "20", "50"]
        default: "10"
      offset:
        description: Candidate-plan offset; compare plan fingerprints between runs
        required: true
        default: "0"
  push:
    branches: [main]
    paths:
      - ".github/workflows/recovery-investigation.yml"

permissions:
  contents: read

# Serialize with the daily worker while reading the shared Drive checkpoint.
concurrency:
  group: bpdb-collection-writer
  cancel-in-progress: false

jobs:
  investigate:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: backend
      PYTHONUNBUFFERED: "1"
      WINDOW_START: ${{ inputs.start_date || '2024-01-01' }}
      WINDOW_END: ${{ inputs.end_date || '2024-12-31' }}
      MAX_FILES: ${{ inputs.max_files || '10' }}
      PLAN_OFFSET: ${{ inputs.offset || '0' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Prepare private Drive credentials
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON }}
          DRIVE_CONFIG_JSON: ${{ secrets.GOOGLE_DRIVE_CONFIG_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          try:
              token = json.loads(os.environ["DRIVE_TOKEN_JSON"])
              config = json.loads(os.environ["DRIVE_CONFIG_JSON"])

              for field in ("refresh_token", "client_id", "client_secret"):
                  if not token.get(field):
                      raise ValueError("Incomplete token")

              if not config.get("folder_id"):
                  raise ValueError("Missing folder ID")
          except Exception:
              raise SystemExit(
                  "Missing or invalid Drive secrets. "
                  "Check the two repository JSON secrets."
              ) from None

          for field in ("refresh_token", "client_secret", "token"):
              if token.get(field):
                  print("::add-mask::" + token[field])

          folder = Path("secrets")
          folder.mkdir(mode=0o700, exist_ok=True)

          for name, value in (
              ("google_drive_token.json", token),
              ("google_drive_config.json", config),
          ):
              target = folder / name
              target.write_text(json.dumps(value), encoding="utf-8")
              target.chmod(0o600)

          print("Drive credentials prepared.")
          PY


      - name: Investigate gaps and preserve evidence in Drive
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -u -m ingestion.online_recovery --start-date "$WINDOW_START" --end-date "$WINDOW_END" --max-files "$MAX_FILES" --offset "$PLAN_OFFSET"

      - name: Publish bounded investigation summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          summaries = sorted(Path("data/recovery_online").glob("*/summary.json"))
          text = "## Online gap investigation\n\n"
          if summaries:
              data = json.loads(summaries[-1].read_text(encoding="utf-8"))
              text += "\n".join(f"- {k}: {v}" for k, v in data.items())
              text += "\n\nNo measurements imported or canonical records promoted.\n"
          else:
              text += "Investigation did not finish. Inspect the failed step and available diagnostics.\n"
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as f:
              f.write(text)
          PY

      - name: Save investigation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpdb-gap-investigation-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            data/recovery_online/*/summary.json
            data/recovery_online/*/investigation.json
            data/recovery_online/*/worklist.json
            data/recovery_online/*/candidate_plan.json
            data/recovery_online/*/storage_receipt.json
            data/recovery_online/*/pdf_*/result.json
            data/recovery_online/*/pdf_*/first_page.txt
            data/recovery_online/*/pdf_001/candidate.pdf
            data/recovery_online/*/pdf_002/candidate.pdf
            data/recovery_online/*/pdf_003/candidate.pdf
            data/recovery_online/*/pdf_004/candidate.pdf

      - name: Remove temporary credentials
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in (
              "google_drive_token.json",
              "google_drive_config.json",
          ):
              (Path("secrets") / name).unlink(missing_ok=True)
          PY

