name: BPDB verified research snapshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/research-snapshot.yml"]
permissions:
  contents: read
concurrency:
  group: bpdb-collection-writer
  cancel-in-progress: false
jobs:
  freeze:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: backend
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Verify research export safety
        run: python -m pytest -q backend/tests/test_freeze_research.py backend/tests/test_preparation.py
      - name: Prepare private Drive credentials
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON }}
          DRIVE_CONFIG_JSON: ${{ secrets.GOOGLE_DRIVE_CONFIG_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          try:
              token = json.loads(os.environ["DRIVE_TOKEN_JSON"])
              config = json.loads(os.environ["DRIVE_CONFIG_JSON"])

              for field in ("refresh_token", "client_id", "client_secret"):
                  if not token.get(field):
                      raise ValueError("Incomplete token")

              if not config.get("folder_id"):
                  raise ValueError("Missing folder ID")
          except Exception:
              raise SystemExit(
                  "Missing or invalid Drive secrets. "
                  "Check the two repository JSON secrets."
              ) from None

          for field in ("refresh_token", "client_secret", "token"):
              if token.get(field):
                  print("::add-mask::" + token[field])

          folder = Path("secrets")
          folder.mkdir(mode=0o700, exist_ok=True)

          for name, value in (
              ("google_drive_token.json", token),
              ("google_drive_config.json", config),
          ):
              target = folder / name
              target.write_text(json.dumps(value), encoding="utf-8")
              target.chmod(0o600)

          print("Drive credentials prepared.")
          PY




      - name: Freeze, verify and archive the observed-only 2024 baseline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u -m ingestion.freeze_research
      - name: Publish research verification summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          reports = sorted(Path("data/research_snapshots").glob("*/verification.json"))
          text = "## Observed-only 2024 research baseline\n\n"
          if reports:
              report = json.loads(reports[-1].read_text(encoding="utf-8"))
              for key in ("snapshot_id", "calendar_days", "canonical_dates",
                          "missing_canonical_dates", "repaired_dates_verified", "estimated_values"):
                  text += f"- {key}: {report[key]}\n"
              text += "\nCheck the freeze/archive step status to confirm durable storage succeeded.\n"
          else:
              text += "Snapshot verification did not complete; inspect the failed step.\n"
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as f:
              f.write(text)
          PY
      - name: Save verified research bundle and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpdb-research-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            data/research_snapshots/*/observed_2024.zip
            data/research_snapshots/*/verification.json
            data/research_snapshots/*/storage_receipt.json
      - name: Remove temporary credentials
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in (
              "google_drive_token.json",
              "google_drive_config.json",
          ):
              (Path("secrets") / name).unlink(missing_ok=True)
          PY


