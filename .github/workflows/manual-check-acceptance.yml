name: BPDB manual-check read-only acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/manual-check-acceptance.yml"]
permissions:
  contents: read
jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: backend
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Check syntax and lint
        run: python -m ruff check backend/research/check_manual_acceptance.py
      - name: Test real read-only preparation and bundle integrity
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u -m research.check_manual_acceptance
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpdb-manual-check-acceptance-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: data/manual_acceptance/*
