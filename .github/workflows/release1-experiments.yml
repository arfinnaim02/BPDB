name: BPDB Release 1 experiments
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/release1-experiments.yml"]
permissions:
  contents: read
concurrency:
  group: bpdb-collection-writer
  cancel-in-progress: false
jobs:
  freeze:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: backend
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-research.txt
      - name: Verify research export safety
        run: python -m pytest -q backend/tests/test_release1.py backend/tests/test_preparation.py
      - name: Prepare private Drive credentials
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON }}
          DRIVE_CONFIG_JSON: ${{ secrets.GOOGLE_DRIVE_CONFIG_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          try:
              token = json.loads(os.environ["DRIVE_TOKEN_JSON"])
              config = json.loads(os.environ["DRIVE_CONFIG_JSON"])

              for field in ("refresh_token", "client_id", "client_secret"):
                  if not token.get(field):
                      raise ValueError("Incomplete token")

              if not config.get("folder_id"):
                  raise ValueError("Missing folder ID")
          except Exception:
              raise SystemExit(
                  "Missing or invalid Drive secrets. "
                  "Check the two repository JSON secrets."
              ) from None

          for field in ("refresh_token", "client_secret", "token"):
              if token.get(field):
                  print("::add-mask::" + token[field])

          folder = Path("secrets")
          folder.mkdir(mode=0o700, exist_ok=True)

          for name, value in (
              ("google_drive_token.json", token),
              ("google_drive_config.json", config),
          ):
              target = folder / name
              target.write_text(json.dumps(value), encoding="utf-8")
              target.chmod(0o600)

          print("Drive credentials prepared.")
          PY




      - name: Freeze, verify and archive the observed-only 2024 baseline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u -m research.release1 --online
      - name: Save experiment results and execution test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpdb-release1-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: data/experiments/release1/*
      - name: Remove temporary credentials
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in (
              "google_drive_token.json",
              "google_drive_config.json",
          ):
              (Path("secrets") / name).unlink(missing_ok=True)
          PY


