name: BPDB monthly cost experiment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/monthly-cost-experiment.yml"]
permissions:
  contents: read
jobs:
  experiment:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: backend
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned research dependencies
        run: python -m pip install -r backend/requirements-research.txt
      - name: Validate fixed experiment
        run: |
          python -m ruff check backend/research/monthly_cost.py backend/tests/test_monthly_cost.py
          python -m pytest -q backend/tests/test_monthly_cost.py
      - name: Execute read-only monthly cost experiment
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u -m research.monthly_cost
      - name: Preserve complete experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpdb-monthly-cost-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: data/monthly_cost/*
