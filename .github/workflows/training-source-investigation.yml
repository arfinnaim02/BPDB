name: BPDB frozen training-source investigation

on:
  workflow_dispatch:
    inputs:
      max_files:
        description: Maximum candidate PDFs in this bounded investigation
        type: choice
        options: ["10", "50", "100"]
        default: "100"
      offset:
        description: Candidate-plan offset; compare plan fingerprints between runs
        required: true
        default: "0"

permissions:
  contents: read

# Serialize with the daily worker while reading the shared Drive checkpoint.
concurrency:
  group: bpdb-collection-writer
  cancel-in-progress: false

jobs:
  investigate:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: backend
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      MAX_FILES: ${{ inputs.max_files || '100' }}
      PLAN_OFFSET: ${{ inputs.offset || '0' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Verify source-grounded parser regression fixtures
        run: python -m pytest -q backend/tests/test_page1_layouts.py backend/tests/test_measurement_review.py

      - name: Prepare private Drive credentials
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON }}
          DRIVE_CONFIG_JSON: ${{ secrets.GOOGLE_DRIVE_CONFIG_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          try:
              token = json.loads(os.environ["DRIVE_TOKEN_JSON"])
              config = json.loads(os.environ["DRIVE_CONFIG_JSON"])

              for field in ("refresh_token", "client_id", "client_secret"):
                  if not token.get(field):
                      raise ValueError("Incomplete token")

              if not config.get("folder_id"):
                  raise ValueError("Missing folder ID")
          except Exception:
              raise SystemExit(
                  "Missing or invalid Drive secrets. "
                  "Check the two repository JSON secrets."
              ) from None

          for field in ("refresh_token", "client_secret", "token"):
              if token.get(field):
                  print("::add-mask::" + token[field])

          folder = Path("secrets")
          folder.mkdir(mode=0o700, exist_ok=True)

          for name, value in (
              ("google_drive_token.json", token),
              ("google_drive_config.json", config),
          ):
              target = folder / name
              target.write_text(json.dumps(value), encoding="utf-8")
              target.chmod(0o600)

          print("Drive credentials prepared.")
          PY


      - name: Investigate gaps and preserve evidence in Drive
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m pytest -q backend/tests/test_training_source_investigation.py backend/tests/test_online_recovery.py
          python -u -m research.investigate_training_sources --max-files "$MAX_FILES" --offset "$PLAN_OFFSET"

      - name: Publish bounded investigation summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          summaries = sorted(Path("data/training_source_investigation").glob("summary.json"))
          text = "## Online gap investigation\n\n"
          if summaries:
              data = json.loads(summaries[-1].read_text(encoding="utf-8"))
              text += "\n".join(f"- {k}: {v}" for k, v in data.items())
              text += "\n\nNo measurements imported or canonical records promoted.\n"
          else:
              text += "Investigation did not finish. Inspect the failed step and available diagnostics.\n"
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as f:
              f.write(text)
          PY

      - name: Save investigation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpdb-training-source-investigation-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            data/training_source_investigation/summary.json
            data/training_source_investigation/investigation.json
            data/training_source_investigation/worklist.json
            data/training_source_investigation/candidate_plan.json
            data/training_source_investigation/storage_receipt.json
            data/training_source_investigation/pdf_*/result.json
            data/training_source_investigation/pdf_*/first_page.txt
            data/training_source_investigation/pdf_001/candidate.pdf
            data/training_source_investigation/pdf_002/candidate.pdf
            data/training_source_investigation/pdf_003/candidate.pdf
            data/training_source_investigation/pdf_004/candidate.pdf
            data/training_source_investigation/pdf_005/candidate.pdf
            data/training_source_investigation/pdf_006/candidate.pdf
            data/training_source_investigation/pdf_007/candidate.pdf
            data/training_source_investigation/pdf_008/candidate.pdf
            data/training_source_investigation/pdf_009/candidate.pdf
            data/training_source_investigation/pdf_010/candidate.pdf
            data/training_source_investigation/pdf_011/candidate.pdf
            data/training_source_investigation/pdf_012/candidate.pdf
            data/training_source_investigation/pdf_013/candidate.pdf
            data/training_source_investigation/pdf_014/candidate.pdf
            data/training_source_investigation/pdf_015/candidate.pdf
            data/training_source_investigation/pdf_016/candidate.pdf

      - name: Remove temporary credentials
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in (
              "google_drive_token.json",
              "google_drive_config.json",
          ):
              (Path("secrets") / name).unlink(missing_ok=True)
          PY

